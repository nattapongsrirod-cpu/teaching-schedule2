            );
        };

        // Component สำหรับการ์ดสรุปข้อมูลครูแต่ละคนในหน้าหลัก
        const TeacherCard = ({ teacher, onClick }) => {
            // เช็คว่าสอนเยอะไปไหม (เกิน 25 คาบให้เป็นสีแดงเตือน)
            const isHeavyLoad = teacher.totalPeriods > 25;
            const periodColor = isHeavyLoad ? 'text-red-600 bg-red-50 border-red-200' : 'text-emerald-700 bg-emerald-50 border-emerald-100';

            return (
                <div 
                    onClick={() => onClick(teacher)}
                    className="bg-white rounded-2xl shadow-sm hover:shadow-md border border-slate-200 p-5 cursor-pointer transition-all hover:-translate-y-1 group"
                >
                    <div className="flex items-start justify-between mb-4">
                        <div className="flex items-center gap-3">
                            <div className="w-12 h-12 rounded-full bg-gradient-to-br from-blue-100 to-blue-50 flex items-center justify-center text-blue-600 font-bold text-lg border border-blue-100 shadow-inner group-hover:scale-110 transition-transform">
                                {teacher.name.charAt(0)}
                            </div>
                            <div>
                                <h3 className="font-bold text-slate-800 text-lg leading-tight group-hover:text-blue-600 transition-colors">{teacher.name}</h3>
                                <p className="text-xs text-slate-500 mt-1">กลุ่มสาระฯ วิทยาศาสตร์และเทคโนโลยี</p>
                            </div>
                        </div>
                    </div>
                    
                    <div className="grid grid-cols-2 gap-3 mb-4">
                        <div className="bg-slate-50 p-3 rounded-xl border border-slate-100">
                            <p className="text-xs text-slate-500 mb-1">วิชาที่สอน</p>
                            <p className="font-semibold text-slate-700">{teacher.subjects.length} วิชา</p>
                        </div>
                        <div className={`p-3 rounded-xl border ${periodColor}`}>
                            <p className="text-xs opacity-80 mb-1">รวมภาระงาน (คาบ)</p>
                            <p className="font-bold text-lg">{teacher.totalPeriods}</p>
                        </div>
                    </div>

                    <div className="border-t pt-3 flex items-center justify-between text-sm text-blue-600 font-medium">
                        <span>ดูตารางสอนแบบละเอียด</span>
                        <i className="fa-solid fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
                    </div>
                </div>
            );
        };

        // Component หลักของระบบ
        const App = () => {
            const [searchQuery, setSearchQuery] = React.useState("");
            const [selectedTeacher, setSelectedTeacher] = React.useState(null);

            // กรองข้อมูลครูตามคำค้นหา (ชื่อ หรือ ชื่อวิชา)
            const filteredTeachers = teachersData.filter(teacher => {
                const query = searchQuery.toLowerCase();
                const matchName = teacher.name.toLowerCase().includes(query);
                const matchSubject = teacher.subjects.some(sub => sub.name.toLowerCase().includes(query));
                return matchName || matchSubject;
            });

            // คำนวณสถิติรวม
            const totalTeachers = teachersData.length;
            const totalPeriodsAll = teachersData.reduce((sum, t) => sum + t.totalPeriods, 0);
            const avgPeriods = (totalPeriodsAll / totalTeachers).toFixed(1);

            return (
                <div className="min-h-screen flex flex-col pb-12">
                    {/* Header Banner */}
                    <header className="bg-slate-800 text-white pt-10 pb-20 px-6 sm:px-8 shadow-lg relative overflow-hidden">
                        {/* Decorative Background Elements */}
                        <div className="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none opacity-10">
                            <i className="fa-solid fa-atom absolute -top-10 -right-10 text-9xl"></i>
                            <i className="fa-solid fa-flask absolute top-20 left-10 text-8xl"></i>
                        </div>

                        <div className="max-w-6xl mx-auto relative z-10">
                            <div className="flex flex-col md:flex-row md:items-center justify-between gap-6">
                                <div>
                                    <div className="inline-block bg-blue-500/20 text-blue-200 text-xs font-semibold px-3 py-1 rounded-full mb-3 border border-blue-400/30">
                                        ภาคเรียนที่ 2 / 2569
                                    </div>
                                    <h1 className="text-3xl md:text-4xl font-bold mb-2">แดชบอร์ดสรุปภาระงานสอน</h1>
                                    <p className="text-slate-300 text-lg">กลุ่มสาระการเรียนรู้วิทยาศาสตร์และเทคโนโลยี</p>
                                </div>
                                
                                {/* Search Box */}
                                <div className="w-full md:w-80 relative">
                                    <i className="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                    <input 
                                        type="text" 
                                        placeholder="ค้นหาชื่อครู หรือ ชื่อรายวิชา..." 
                                        className="w-full pl-11 pr-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:bg-white/20 transition-all backdrop-blur-sm"
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                    />
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-1 max-w-6xl mx-auto w-full px-4 sm:px-6 md:px-8 -mt-10 relative z-20">
                        
                        {/* Stats Row */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                            <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex items-center gap-4">
                                <div className="w-12 h-12 rounded-xl bg-blue-100 flex items-center justify-center text-blue-600 text-xl">
                                    <i className="fa-solid fa-users"></i>
                                </div>
                                <div>
                                    <p className="text-sm text-slate-500 font-medium">จำนวนครูทั้งหมด (ในระบบ)</p>
                                    <p className="text-2xl font-bold text-slate-800">{totalTeachers} <span className="text-base font-normal text-slate-500">ท่าน</span></p>
                                </div>
                            </div>
                            <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex items-center gap-4">
                                <div className="w-12 h-12 rounded-xl bg-purple-100 flex items-center justify-center text-purple-600 text-xl">
                                    <i className="fa-solid fa-clock"></i>
                                </div>
                                <div>
                                    <p className="text-sm text-slate-500 font-medium">รวมคาบสอนทั้งหมวด</p>
                                    <p className="text-2xl font-bold text-slate-800">{totalPeriodsAll} <span className="text-base font-normal text-slate-500">คาบ</span></p>
                                </div>
                            </div>
                            <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex items-center gap-4">
                                <div className="w-12 h-12 rounded-xl bg-emerald-100 flex items-center justify-center text-emerald-600 text-xl">
                                    <i className="fa-solid fa-chart-pie"></i>
                                </div>
                                <div>
                                    <p className="text-sm text-slate-500 font-medium">เฉลี่ยภาระงานสอน</p>
                                    <p className="text-2xl font-bold text-slate-800">{avgPeriods} <span className="text-base font-normal text-slate-500">คาบ/ท่าน</span></p>
                                </div>
                            </div>
                        </div>

                        {/* Teachers Grid */}
                        <div className="mb-6 flex justify-between items-end">
                            <h2 className="text-xl font-bold text-slate-800 border-l-4 border-blue-500 pl-3">รายชื่อครูผู้สอน</h2>
                            <p className="text-sm text-slate-500">แสดง {filteredTeachers.length} รายการ</p>
                        </div>

                        {filteredTeachers.length > 0 ? (
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                                {filteredTeachers.map(teacher => (
                                    <TeacherCard 
                                        key={teacher.id} 
                                        teacher={teacher} 
                                        onClick={setSelectedTeacher}
                                    />
                                ))}
                            </div>
                        ) : (
                            <div className="bg-white rounded-2xl p-12 text-center shadow-sm border border-slate-200">
                                <div className="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-300 text-3xl">
                                    <i className="fa-solid fa-search"></i>
                                </div>
                                <h3 className="text-lg font-bold text-slate-700 mb-1">ไม่พบข้อมูล</h3>
                                <p className="text-slate-500">ไม่มีรายชื่อครูหรือวิชาที่ตรงกับคำค้นหา "{searchQuery}"</p>
                                <button 
                                    onClick={() => setSearchQuery('')}
                                    className="mt-4 px-4 py-2 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-100 transition-colors font-medium text-sm"
                                >
                                    ล้างคำค้นหา
                                </button>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="mt-auto py-6 text-center text-slate-400 text-sm">
                        <p>จัดทำข้อมูลตามเอกสารมอบหมายการสอน กลุ่มสาระฯ วิทยาศาสตร์และเทคโนโลยี</p>
                    </footer>

                    {/* Teacher Detail Modal */}
                    <TeacherModal 
                        teacher={selectedTeacher} 
                        onClose={() => setSelectedTeacher(null)} 
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
